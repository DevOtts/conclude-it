<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1220"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#5b7ca6"/>
    </marker>
  </defs>

  <rect width="1200" height="330" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="328" rx="13" fill="none" stroke="#22314a" stroke-width="2"/>

  <!-- title -->
  <text x="48" y="52" font-size="26" font-weight="700" fill="#e8eefc">/conclude-it</text>
  <text x="48" y="76" font-size="13" fill="#8fa3c4">one door for every session close — ship-proof it, file it, clean it, verdict it</text>

  <!-- entry pill -->
  <rect x="48" y="140" width="150" height="44" rx="22" fill="#16233c" stroke="#3b5b8c" stroke-width="1.5"/>
  <text x="123" y="167" font-size="14" fill="#cdd9f0" text-anchor="middle">session ends</text>

  <!-- arrow to triage -->
  <line x1="198" y1="162" x2="252" y2="162" stroke="#5b7ca6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- triage diamond -->
  <g>
    <polygon points="330,108 412,162 330,216 248,162" fill="#1a2440" stroke="#4f6ea3" stroke-width="1.5"/>
    <text x="330" y="156" font-size="13" font-weight="700" fill="#e8eefc" text-anchor="middle">STEP 0</text>
    <text x="330" y="174" font-size="12" fill="#9fb2d4" text-anchor="middle">ship-shaped?</text>
  </g>

  <!-- YES branch: ship pipeline -->
  <line x1="412" y1="162" x2="470" y2="120" stroke="#5b7ca6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="432" y="128" font-size="11" fill="#7fd1a0">yes</text>
  <g>
    <rect x="474" y="72" width="360" height="96" rx="10" fill="#12233a" stroke="#2e6e4f" stroke-width="1.5"/>
    <text x="490" y="94" font-size="12" font-weight="700" fill="#7fd1a0">SHIP PIPELINE · fail-closed</text>
    <text x="490" y="116" font-size="12" fill="#cdd9f0">local gate 🔴→🟢 → merge + deploy → prod gate 🔴→🟢</text>
    <text x="490" y="136" font-size="12" fill="#cdd9f0">archive plan docs → backlog → PM board</text>
    <text x="490" y="156" font-size="11" fill="#8fa3c4">a red gate never advances · no prod target = said loudly</text>
  </g>

  <!-- NO branch -->
  <line x1="412" y1="162" x2="470" y2="204" stroke="#5b7ca6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="432" y="204" font-size="11" fill="#8fa3c4">no</text>

  <!-- ship joins core -->
  <line x1="834" y1="120" x2="880" y2="162" stroke="#5b7ca6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- close core -->
  <g>
    <rect x="474" y="186" width="360" height="96" rx="10" fill="#131f38" stroke="#4f6ea3" stroke-width="1.5"/>
    <text x="490" y="208" font-size="12" font-weight="700" fill="#9db8e8">CLOSE CORE · every session</text>
    <text x="490" y="230" font-size="12" fill="#cdd9f0">debrief + supersession sweep → ledger card</text>
    <text x="490" y="250" font-size="12" fill="#cdd9f0">mid-flight check → reap agents → footprint sweep</text>
    <text x="490" y="270" font-size="11" fill="#8fa3c4">secrets at rest swept FIRST · ownership proven, never globbed</text>
  </g>

  <!-- core joins verdict -->
  <line x1="834" y1="234" x2="880" y2="200" stroke="#5b7ca6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- verdict -->
  <g>
    <rect x="884" y="130" width="268" height="110" rx="10" fill="#1a2440" stroke="#8a6d3b" stroke-width="1.5"/>
    <text x="900" y="154" font-size="12" font-weight="700" fill="#e8c987">HONEST VERDICT</text>
    <text x="900" y="178" font-size="12" fill="#7fd1a0">✅ safe to exit — proven + filed + clean</text>
    <text x="900" y="198" font-size="12" fill="#e8a1a1">⚠️ not yet — blocker named + choices</text>
    <text x="900" y="222" font-size="11" fill="#8fa3c4">+ CONCLUDE_REPORT.html (ship closes):</text>
    <text x="900" y="238" font-size="11" fill="#8fa3c4">every card has a "How to test" block</text>
  </g>

  <!-- footer -->
  <text x="48" y="308" font-size="12" fill="#5f7396">plan-it plans it · build-it builds it · review-it reviews it · conclude-it concludes it</text>
  <text x="1152" y="308" font-size="12" fill="#5f7396" text-anchor="end">github.com/DevOtts</text>
</svg>
